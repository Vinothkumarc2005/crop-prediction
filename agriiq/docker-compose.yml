version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agriiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agriiq
      POSTGRES_USER: agriiq
      POSTGRES_PASSWORD: agriiq_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriiq -d agriiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend (unified — replaces Spring Boot + ML service) ───────────
  fastapi-backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: agriiq-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agriiq:agriiq_secret@postgres:5432/agriiq
      JWT_SECRET: change_me_in_production_please_use_a_256_bit_secret_key_here
      JWT_EXPIRATION_SECONDS: 86400
      MODEL_DIR: /app/ml_models
      NDVI_PROVIDER: mock
      SOIL_PROVIDER: mock
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:80"]'
      DEBUG: "false"
      # Real API keys (optional, ignored when provider=mock)
      SENTINEL_HUB_CLIENT_ID: ""
      SENTINEL_HUB_CLIENT_SECRET: ""
      AGMARKNET_API_KEY: ""
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/ml_models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Frontend (React / Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: agriiq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      fastapi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  ml_models:

networks:
  default:
    name: agriiq-net
